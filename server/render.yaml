services:
  - type: web
    name: radar-de-sinais
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/ping
    envVars:
      - key: APP_PIN
        sync: false
      - key: TWELVE_DATA_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: API2TRADE_API_KEY
        sync: false
      - key: API2TRADE_ACCOUNT_ID
        sync: false
      - key: IQ_EMAIL
        sync: false
      - key: IQ_PASSWORD
        sync: false
